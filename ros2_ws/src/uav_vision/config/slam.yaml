slam_toolbox:
  ros__parameters:
    use_sim_time: true

    odom_frame: odom
    map_frame: map
    base_frame: base_link

    scan_topic: /uav/lidar/scan

    mode: mapping

    resolution: 0.05
    map_update_interval: 1.0
    transform_publish_period: 0.02

    min_laser_range: 0.15
    max_laser_range: 30.0
    scan_queue_size: 1
    throttle_scans: 3
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
