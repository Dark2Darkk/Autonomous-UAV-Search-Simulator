controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 5.0
    odom_topic: /uav/odom

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: true

      # Forward motion only for v1
      min_vel_x: 0.0
      max_vel_x: 1.0

      # No sideways movement yet
      min_vel_y: 0.0
      max_vel_y: 0.0

      # Yaw
      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.5

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325

      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /uav/odom

    transform_tolerance: 0.5


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.5
    cycle_frequency: 5.0


waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: false


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.5

      plugins:
        [
          "obstacle_layer",
          "inflation_layer"
        ]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /uav/lidar/scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.15
          obstacle_max_range: 30.0

          raytrace_min_range: 0.15
          raytrace_max_range: 30.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.8
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 1.0
      publish_frequency: 1.0

      resolution: 0.05
      robot_radius: 0.5

      track_unknown_space: true

      plugins:
        [
          "static_layer",
          "obstacle_layer",
          "inflation_layer"
        ]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /uav/lidar/scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.15
          obstacle_max_range: 30.0

          raytrace_min_range: 0.15
          raytrace_max_range: 30.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.8
        cost_scaling_factor: 3.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 10.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]

    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]

    odom_topic: /uav/odom
    odom_duration: 0.1

    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"

    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"

      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6

      visualize: false
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/uav/lidar/scan"
      enabled: true
